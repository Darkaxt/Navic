name: Build Navic

on:
  push:
    tags:
      - 'v*'
    branches:
      - '*'
  pull_request:
    paths:
      - composeApp/**
      - androidApp/**
      - gradle/**
      - iosApp/**
      - build.gradle.kts
      - settings.gradle.kts
      - scripts/test-reader-vendor-assets-verifier.ps1
      - scripts/update-reader-vendor-manifest.ps1
      - scripts/verify-reader-vendor-assets.ps1
      - .github/workflows/build.yml
      - "!**/strings.xml"
  workflow_dispatch:
    inputs:
      build_ios:
        description: Build and attach iOS IPA
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify reader vendor governance
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-reader-vendor-assets-verifier.ps1

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build with Gradle (release)
        id: build_release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          RELEASE: "true"
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_STORE_FILE: ${{ github.workspace }}/release.keystore
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/verify-android-release-version.ps1 -ExpectedVersionName "$GITHUB_REF_NAME"
          fi
          echo "${{ secrets.KEYSTORE }}" | base64 -d > release.keystore
          ./gradlew :androidApp:packageRelease --stacktrace
          rm release.keystore

      - name: Verify release APK signing
        if: steps.build_release.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find androidApp/build/outputs/apk/release -name '*.apk' | head -n 1)"
          if [[ -z "$apk" ]]; then
            echo "No release APK found"
            exit 1
          fi

          build_tools="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          "$ANDROID_HOME/build-tools/$build_tools/apksigner" verify --print-certs "$apk" | tee apk-certs.txt

          expected_cert_sha256="ebbe97087182d720ffcb5125b1050e8adccc5db25b23b5b73c9495b9eaa1dae7"
          actual_cert_sha256="$(sed -n 's/^.*certificate SHA-256 digest: //p' apk-certs.txt | head -n 1)"
          if [[ "$actual_cert_sha256" != "$expected_cert_sha256" ]]; then
            echo "Release APK is signed with an unexpected certificate."
            echo "Expected: $expected_cert_sha256"
            echo "Actual:   ${actual_cert_sha256:-missing}"
            exit 1
          fi

          if grep -q 'CN=Android Debug' apk-certs.txt; then
            echo "Release APK is signed with an Android Debug certificate; refusing to publish it."
            exit 1
          fi

      - name: Build with Gradle (debug)
        id: build_debug
        if: github.event_name == 'pull_request'
        run: |
          ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Verify packaged reader vendor assets
        if: steps.build_release.outcome == 'success' || steps.build_debug.outcome == 'success'
        shell: pwsh
        run: |
          $apk = Get-ChildItem androidApp/build/outputs/apk -Recurse -Filter *.apk | Select-Object -First 1
          if ($null -eq $apk) {
            throw "No APK found for reader vendor verification."
          }
          pwsh -NoProfile -File scripts/verify-reader-vendor-assets.ps1 -ApkPath $apk.FullName

      - name: Upload APK artifact
        if: steps.build_release.outcome == 'success' || steps.build_debug.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: navic-release-android
          path: androidApp/build/outputs/apk/**/*.apk
          compression-level: 0

  build-ipa:
    name: Build iOS IPA
    if: ${{ (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')) || (github.event_name == 'workflow_dispatch' && inputs.build_ios) }}
    runs-on: macos-26
    timeout-minutes: 45
    continue-on-error: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Cache konan
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Run Gradle tasks
        run: ./gradlew :composeApp:generateValkyrieImageVector

      - name: Build IPA
        run: |
          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "iosApp.xcarchive" \
            CODE_SIGN_ENTITLEMENTS="iosApp/entitlements.xml" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

          mkdir -p Payload

          APP_PATH=$(find "iosApp.xcarchive/Products/Applications" -name "*.app" | head -n 1)
          cp -r "$APP_PATH" Payload/

          zip -r "Navic.ipa" Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: navic-release-ios
          path: Navic.ipa
          compression-level: 0

  upload-artifacts-to-discord:
    name: Upload Artifacts to Discord
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [ build-apk ]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@v7
      - name: Post artifacts to Discord webhook
        shell: bash
        if: env.CI_BUILD_WEBHOOK
        env:
          CI_BUILD_WEBHOOK: ${{ secrets.CI_BUILD_WEBHOOK }}
        run: |
          shopt -s nullglob globstar

          files=()
          i=1
          for file in **/*.apk; do  # TODO: Add ipa - too big for Discord 10mb limit (need boooosts)
            files+=("-F file${i}=@${file}")
            ((i++))
          done

          if (( ${#files[@]} == 0 )); then
            echo "No files to upload"
            exit 0
          fi

          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          payload=$(jq -n --arg content "Builds for [${GITHUB_SHA::7}](<$run_url>)" '{$content}')

          curl -XPOST "$CI_BUILD_WEBHOOK" -F "payload_json=$payload" "${files[@]}"

  create-release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [ build-apk ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          name: navic-release-android
      - name: Generate GitHub Release Notes
        shell: bash
        run: |
          set -euo pipefail

          previous_tag="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"
          if [[ -n "$previous_tag" ]]; then
            range="$previous_tag..$GITHUB_SHA"
          else
            range="$GITHUB_SHA"
          fi

          commit_notes="$(git log --no-merges --pretty=format:'- %s (`%h`)' "$range" | sed '/^-  (`[0-9a-f]*`)$/d')"
          if [[ -z "$commit_notes" ]]; then
            commit_notes="- Release $GITHUB_REF_NAME"
          fi

          {
            echo "## Changes"
            printf '%s\n' "$commit_notes"
            echo
            echo
            echo "## Verification"
            echo "- GitHub Actions Android release build completed successfully."
          } > release-notes.md
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob globstar

          gh release create "$GITHUB_REF_NAME" **/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --latest --notes-file release-notes.md

  attach-ipa-to-release:
    name: Attach iOS IPA to GitHub Release
    if: always() && startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.create-release.result == 'success' && needs.build-ipa.result == 'success'
    needs: [ create-release, build-ipa ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        id: download_ipa
        continue-on-error: true
        with:
          name: navic-release-ios
      - name: Attach IPA to GitHub Release
        if: steps.download_ipa.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob globstar

          gh release upload "$GITHUB_REF_NAME" **/*.ipa \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
